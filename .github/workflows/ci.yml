name: Backend CI

on:
    push:
    workflow_dispatch:

jobs:
    backend-ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            - name: Install pnpm
              run: npm install --global pnpm@12.15.0

            - name: Verify pnpm
              run: pnpm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            - name: Build
              run: pnpm build
