name: CI

on:
    push:
    workflow_dispatch:
jobs:
    backend_ci:
        runs-on: ubuntu-latest
        steps:
            - name: "Checkout code"
              uses: actions/checkout@v4

            - name: "Set up node js"
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: "Set up pnpm manager"
              uses: pnpm/action-setup@v4
              with:
                  version: 12.15.0

            - name: "Install dependencies"
              run: pnpm install --frozen-lockfile

            - name: "Run typecheck"
              run: pnpm typecheck

            - name: "Run tests"
              run: pnpm test

            - name: "Run build"
              run: pnpm build
